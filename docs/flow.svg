<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">haos-isoinstall — what the wizard does, in order</text>

  <!-- step boxes: blue = safe, red = destructive, green = nothing to lose -->
  <g stroke-width="2">
    <rect x="290" y="60" width="320" height="58" rx="8" fill="#f8fafc" stroke="#2563eb"/>
    <rect x="290" y="146" width="320" height="58" rx="8" fill="#f8fafc" stroke="#2563eb"/>
    <rect x="290" y="232" width="320" height="58" rx="8" fill="#f8fafc" stroke="#2563eb"/>
    <rect x="290" y="318" width="320" height="58" rx="8" fill="#f8fafc" stroke="#2563eb"/>
    <rect x="290" y="404" width="320" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <rect x="290" y="490" width="320" height="58" rx="8" fill="#fef2f2" stroke="#dc2626"/>
    <rect x="290" y="576" width="320" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <rect x="290" y="662" width="320" height="58" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
  </g>

  <g font-size="15" font-weight="600" fill="#0f172a">
    <text x="450" y="84" text-anchor="middle">1 · Language</text>
    <text x="450" y="170" text-anchor="middle">2 · Image source</text>
    <text x="450" y="256" text-anchor="middle">3 · Network</text>
    <text x="450" y="342" text-anchor="middle">4 · Disk selection</text>
    <text x="450" y="428" text-anchor="middle">5 · Get and check the image</text>
    <text x="450" y="514" text-anchor="middle">6 · Erase and write</text>
    <text x="450" y="600" text-anchor="middle">7 · Read back and verify</text>
    <text x="450" y="686" text-anchor="middle">8 · Reboot into Home Assistant</text>
  </g>

  <g font-size="12.5" fill="#475569">
    <text x="450" y="103" text-anchor="middle">14 languages, layout applied for you</text>
    <text x="450" y="189" text-anchor="middle">download the latest, or a stick you bring</text>
    <text x="450" y="275" text-anchor="middle">only needed when downloading</text>
    <text x="450" y="361" text-anchor="middle">type YES; the contents are shown first</text>
    <text x="450" y="447" text-anchor="middle">verified before your disk is touched</text>
    <text x="450" y="533" text-anchor="middle">the only point of no return</text>
    <text x="450" y="619" text-anchor="middle">optional, catches a failing disk or cable</text>
    <text x="450" y="705" text-anchor="middle">remove the stick when asked</text>
  </g>

  <!-- arrows between the steps -->
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="450" y1="120" x2="450" y2="202"/>
    <line x1="450" y1="206" x2="450" y2="288"/>
    <line x1="450" y1="292" x2="450" y2="374"/>
    <line x1="450" y1="378" x2="450" y2="460"/>
    <line x1="450" y1="464" x2="450" y2="546"/>
    <line x1="450" y1="550" x2="450" y2="632"/>
    <line x1="450" y1="636" x2="450" y2="718"/>
  </g>

  <!-- the low-RAM path, attached to the get-and-check step -->
  <g stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-dash)">
    <path d="M 610 433 L 700 433"/>
  </g>
  <rect x="700" y="377" width="176" height="112" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="788" y="397" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7c2d12">Too little RAM?</text>
  <text x="788" y="417" text-anchor="middle" font-size="11.5" fill="#7c2d12">the image waits on a USB</text>
  <text x="788" y="433" text-anchor="middle" font-size="11.5" fill="#7c2d12">stick instead, and is</text>
  <text x="788" y="449" text-anchor="middle" font-size="11.5" fill="#7c2d12">checked there before</text>
  <text x="788" y="465" text-anchor="middle" font-size="11.5" fill="#7c2d12">anything is erased</text>

  <!-- the boundary that matters: last safe step above, first destructive below -->
  <g stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3">
    <line x1="120" y1="476" x2="282" y2="476"/>
  </g>
  <text x="118" y="436" font-size="12.5" font-weight="600" fill="#991b1b">above this line:</text>
  <text x="118" y="452" font-size="11.5" fill="#991b1b">nothing is written</text>
  <text x="118" y="468" font-size="11.5" fill="#991b1b">yet, so it can fail</text>
  <text x="118" y="500" font-size="12.5" font-weight="600" fill="#991b1b">below it: the disk</text>
  <text x="118" y="516" font-size="11.5" fill="#991b1b">is already erased</text>
</svg>
