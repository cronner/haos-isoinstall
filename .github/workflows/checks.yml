name: Checks

# Fast, disk-less checks: no live-build, no container, no ISO. They run on every
# push to main as well, where the build does not -- a translation edit that
# forgets one language must not slide through just because nobody rebuilt.
on:
  workflow_dispatch:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax, functions and string tables
        run: bash tests/strings.sh

      # The medium chosen to stage the image on is the one place where a wrong
      # answer destroys data, so its decision logic is tested with stubs rather
      # than trusted to review.
      - name: Staging-medium selection
        run: bash tests/stage.sh

      # An image the user brings must never be written for the wrong board: the
      # file name decides whether it is offered at all, and that decision, plus
      # the media scan, is tested rather than reviewed.
      - name: Offline image discovery
        run: bash tests/image.sh

      # Unattended mode erases a disk with nobody in front of the screen, so the
      # parsing that authorises it and the rules that pick the disk are tested
      # rather than reviewed.
      - name: Unattended mode
        run: bash tests/unattended.sh

      - name: ShellCheck
        run: |
          # Warnings stay informative so that style does not break anything;
          # only real errors block.
          shellcheck -S warning build-iso.sh haos-installer.sh tests/strings.sh tests/stage.sh tests/image.sh tests/unattended.sh || true
          shellcheck -S error build-iso.sh haos-installer.sh tests/strings.sh tests/stage.sh tests/image.sh tests/unattended.sh
