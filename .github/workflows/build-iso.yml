name: Build ISO

on:
  workflow_dispatch:          # manual build
  push:
    tags: ['v*']              # a v1.0.0 tag -> build + release
  pull_request:
    paths: ['build-iso.sh', 'haos-installer.sh']

# A build takes several minutes. Pushing twice in a row used to queue two builds,
# the second of which nobody waits for: cancel the superseded one instead.
# A tag is never cancelled -- that build produces the release.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The Debian container runs 'run' steps with sh (dash) by default, which ignores
# bashisms (e.g. ${VAR//x/y}). We force bash everywhere.
defaults:
  run:
    shell: bash

jobs:
  build:
    # GitHub runners only exist as Ubuntu/Windows/macOS: no Debian.
    # So we build INSIDE a Debian container (same live-build and same debootstrap
    # as the dev environment), on an Ubuntu host.
    # --privileged is required: live-build needs the loop devices and chroot.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: debian:trixie
      options: --privileged
    permissions:
      contents: write          # required to create the release on tag
    steps:
      - uses: actions/checkout@v7

      # The downloads are the slow part of the install steps below. The key
      # carries the workflow file, so editing the package list still gets a
      # clean cache instead of a stale one.
      - name: Cache the Debian package index
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-trixie-${{ hashFiles('.github/workflows/build-iso.yml') }}
          restore-keys: apt-trixie-

      - name: Syntax check
        run: |
          bash -n build-iso.sh
          bash -n haos-installer.sh
          apt-get update && apt-get install -y shellcheck
          # Blocking on ERRORS only: warnings stay informative so that style
          # does not break the build.
          shellcheck -S warning build-iso.sh haos-installer.sh || true
          shellcheck -S error build-iso.sh haos-installer.sh

      - name: Install live-build
        run: |
          apt-get install -y live-build debootstrap fdisk sudo libarchive-tools xorriso
          apt-get install -y p7zip-full || true   # missing from some Debian versions
          lb --version
          echo "--- does debootstrap know the target? ---"
          ls /usr/share/debootstrap/scripts/ | grep -E 'trixie|bookworm' || true

      - name: Build the ISO
        run: |
          chmod +x build-iso.sh haos-installer.sh
          bash ./build-iso.sh

      - name: Check the ISO's UEFI conformance
        run: |
          set -x
          ISO=$(ls haos-installer-iso/live-image-*.iso | head -1)

          # 1) EFI partition present in the table
          fdisk -l "$ISO" | grep -i 'EFI' \
            || { echo "ERROR: no EFI partition in the ISO"; exit 1; }

          # 2) Fallback loader present. We list the ISO9660 with several tools:
          #    a missing tool must NOT be confused with a missing file.
          LIST=""
          for tool in "bsdtar -tf" "7z l" "xorriso -indev"; do
            bin=${tool%% *}
            command -v "$bin" >/dev/null || continue
            case "$bin" in
              xorriso) out=$(xorriso -indev "$ISO" -find / 2>/dev/null) ;;
              *)       out=$($tool "$ISO" 2>/dev/null) ;;
            esac
            [ -n "$out" ] && { LIST="$out"; echo "--- listing obtained via $bin ---"; break; }
          done

          if [ -z "$LIST" ]; then
            echo "ERROR: no tool could list the ISO (bsdtar/7z/xorriso)"; exit 1
          fi

          echo "$LIST" | grep -i 'efi' || true
          echo "$LIST" | grep -qi 'bootx64.efi' \
            || { echo "ERROR: /EFI/boot/bootx64.efi not found in the ISO"; exit 1; }
          echo "OK: UEFI-conformant ISO (ESP + bootx64.efi)"

          # 2b) The MIT notice must be inside the artefact, not only in the repo.
          #     It is placed on the ISO surface (config/includes.binary) so this
          #     listing can see it; the copy in /usr/local/share/doc lives inside
          #     filesystem.squashfs and is not visible here.
          echo "$LIST" | grep -qE '(^|[[:space:]/])LICENSE$' \
            || { echo "ERROR: no LICENSE at the root of the ISO"; exit 1; }
          echo "OK: licence is on the ISO surface"

          # 3) Partition table, for the record in the build logs. We expect two:
          #    the ISO9660 and the ESP. No log partition, see the note in build-iso.sh.
          fdisk -l "$ISO" | tail -6

          # 4) BIOS boot: the El Torito entry is only produced by live-build's
          #    default (--bootloaders is not passed). We check it so that a
          #    live-build change cannot make it disappear silently.
          if command -v xorriso >/dev/null; then
            xorriso -indev "$ISO" -report_el_torito plain 2>/dev/null | head -20 || true
          fi

      - name: Rename and compute the SHA256
        id: iso
        run: |
          ISO=$(ls haos-installer-iso/live-image-*.iso | head -1)
          REF=$(echo "${GITHUB_REF_NAME:-manual}" | tr '/' '-')
          NAME="haos-isoinstall-${REF}-amd64.iso"
          mv "$ISO" "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### $NAME" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h "$NAME" >> "$GITHUB_STEP_SUMMARY"
          cat "$NAME.sha256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.iso.outputs.name }}
          path: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.name }}.sha256
          retention-days: 14

      - name: Publish the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.name }}.sha256
          body: |
            Guided **Home Assistant OS** installer, as a bootable USB image for
            x86-64 PCs and VMs. Built from `${{ github.sha }}`.

            **14 languages**, each with its keyboard layout applied automatically:
            English, Danish, Czech, Dutch, Finnish, French, German, Italian,
            Norwegian, Polish, Portuguese, Russian, Spanish, Swedish.

            The Home Assistant OS image is **not** inside the ISO: it is downloaded
            during the installation, so this stays small (~470 MiB) and always
            installs the latest published version.

            **Requirements:** x86-64 PC, UEFI (CSM off), Secure Boot **disabled**,
            SATA in **AHCI**, a disk of at least 32 GB, and an Internet connection.

            Verify the download before writing it:

            ```
            sha256sum -c ${{ steps.iso.outputs.name }}.sha256
            ```

            Licensed **MIT**: the licence and both guides travel inside the
            image (`LICENSE` at the ISO root, and
            `/usr/local/share/doc/haos-isoinstall` in the live system).

            **Provided as is, with no warranty and no support.** This tool
            completely erases the disk you select. Read the README first.

            Unofficial project, not affiliated with the Open Home Foundation
            or Nabu Casa.
